# Single Netlify site: apps/web (Next.js) is the main build, apps/api
# (Express) is wrapped as a Netlify Function and reached same-origin via the
# /api/* redirect below - see docs/netlify-deploy.md.
[build]
  base = "apps/web"
  # --include=dev overrides npm's own NODE_ENV=production convention, which
  # otherwise skips devDependencies during `npm ci` - and Netlify sets
  # NODE_ENV=production for every production build by default (independent
  # of the NODE_ENV env var we set for the deployed function's own runtime).
  # Without this, tailwindcss/postcss/autoprefixer/@netlify/plugin-nextjs
  # never get installed and the Next.js build fails outright.
  command = "npm ci --include=dev && npm run build && npm ci --prefix ../api --include=dev"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "../api/netlify/functions"
  node_bundler = "esbuild"
  # The mock listings provider (LISTINGS_PROVIDER=mock) reads this at runtime
  # via fs.readFileSync, not a static import, so esbuild's dependency tracer
  # won't pick it up on its own - see the LAMBDA_TASK_ROOT branch in
  # apps/api/src/config/env.js for how this gets found at runtime. The real
  # dataset (328 real Bronx listings, actual ZIP coverage) is what the
  # deployed site uses - the tiny curated one is a unit-test fixture only.
  included_files = ["../../data/listings-real.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
